  <meta charset="utf-8" />

  <meta property="og:image" content="https://mrsniffs.co/assets/img/og-image.jpg" />
  <meta property="og:image:width" content="1200" />

  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preload" href="assets/fonts/big-shoulders-display-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

<body class="page-soon">
  <main class="soon" id="main">
    <img class="soon__bg" src="assets/img/hero-bg.webp" width="2200" height="1228" alt="" aria-hidden="true" />
    <img class="soon__product" src="assets/img/hero.webp" width="2400" height="1728" alt="Bonfire and Yoga Studio incense boxes on driftwood beside a burning stick" />
    <div class="soon__copy">
      <img class="soon__logo" src="assets/icons/logo.svg" width="129" height="54" alt="Mr. Sniff's" />
      <p class="soon__eyebrow">Incense sticks and holders</p>
      <h1 class="soon__title">Lighting up<br />December 15.</h1>
      <p class="soon__lede">Two scents made of nothing but wood. Get on the list and you'll be the first to get a whiff.</p>
      <form class="signup__form soon__form" data-signup novalidate>
        <div class="signup__row">
          <label class="sr-only" for="soon-email">Email address</label>
          <input class="signup__input" id="soon-email" name="email" type="email" placeholder="your@email.com" autocomplete="email" required />
          <button class="btn btn--light" type="submit">Notify me</button>
        </div>
        <label class="consent">
          <input type="checkbox" name="consent" required />
          <span class="consent__box" aria-hidden="true"></span>
          <span>Yes, email me when Mr. Sniff's launches. Unsubscribe anytime.</span>
        </label>
        <p class="form-msg" data-signup-msg role="status"></p>
      </form>
      <details class="soon__pass">
        <summary>Have the store password?</summary>
        <form class="soon__pass-form" action="index.html">
          <label class="sr-only" for="soon-pass">Store password</label>
          <input id="soon-pass" type="password" placeholder="Password" autocomplete="current-password" />
          <button class="btn btn--ghost-light btn--sm" type="submit">Enter</button>
        </form>
      </details>
    </div>
  </main>
</body>
</html>
